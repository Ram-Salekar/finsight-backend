spring.application.name=finsight-backend

# Load DB_USERNAME/DB_PASSWORD (and any other secrets) from a project-local .env
# file (git-ignored) at the repo root. "optional:" means the app still starts fine
# if .env is missing (e.g. someone hasn't set theirs up yet) instead of crashing.
spring.config.import=optional:file:.env[.properties]

# --- Database connection ---
# Username/password come from .env (imported above), never hardcoded here,
# since this file is committed to git.
spring.datasource.url=jdbc:mysql://localhost:3306/finsight_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# ddl-auto=update: Hibernate inspects your @Entity classes and auto-creates/alters
# tables to match on every startup. Fine for local dev; NOT how you'd manage schema
# in a real production project (Flyway/Liquibase instead, ddl-auto=validate there).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
