spring.application.name=finsight-backend

# --- Database connection ---
# Username/password come from environment variables (DB_USERNAME, DB_PASSWORD),
# never hardcoded here, since this file is committed to git.
spring.datasource.url=jdbc:mysql://localhost:3306/finsight_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# ddl-auto=update: Hibernate inspects your @Entity classes and auto-creates/alters
# tables to match on every startup. Fine for local dev; NOT how you'd manage schema
# in a real production project (Flyway/Liquibase instead, ddl-auto=validate there).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
